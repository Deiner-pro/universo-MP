<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universo Para María</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #020108;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      user-select: none;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    
    /* Título brillante superior */
    #titulo {
      position: absolute;
      top: 35px;
      left: 50%;
      transform: translateX(-50%);
      color: #ffffff;
      font-size: 2.5rem;
      font-weight: 800;
      text-align: center;
      text-shadow: 0 0 20px rgba(255, 105, 180, 0.8), 0 0 40px rgba(255, 182, 193, 0.5);
      pointer-events: none;
      z-index: 10;
      letter-spacing: 1px;
    }

    /* Mensaje instructivo inferior */
    #instruccion {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.65);
      font-size: 0.88rem;
      letter-spacing: 0.8px;
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 0 10px rgba(0,0,0,0.8);
    }

    /* Frases flotantes SIN bordes ni cuadros */
    .frase-tag {
      position: absolute;
      color: #ffffff;
      font-size: 0.82rem;
      font-weight: 600;
      pointer-events: none;
      white-space: nowrap;
      transform: translate(-50%, -100%);
      text-shadow: 0 0 8px rgba(255, 105, 180, 0.9), 
                   0 0 15px rgba(0, 0, 0, 0.9),
                   2px 2px 4px rgba(0,0,0,0.9);
      transition: opacity 0.2s ease;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>

  <div id="titulo">Universo Para María 🌌</div>
  <div id="instruccion">Usa el ratón para mover la galaxia y hacer zoom</div>
  
  <div id="labels-container"></div>
  <div id="canvas-container"></div>

  <!-- Library Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // 1. Configuración Principal
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020108, 0.005);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 30, 50);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.04;
    controls.maxPolarAngle = Math.PI / 2 + 0.15;

    // 2. Iluminación Realista
    const ambientLight = new THREE.AmbientLight(0xffb6c1, 0.6);
    scene.add(ambientLight);

    const sunLight = new THREE.PointLight(0xffea9f, 4, 300);
    scene.add(sunLight);

    // 3. Estrellas Parpadeantes (Puntos brillantes con Shader)
    const starCount = 3500;
    const starGeo = new THREE.BufferGeometry();
    const starPositions = new Float32Array(starCount * 3);
    const starScales = new Float32Array(starCount);

    for (let i = 0; i < starCount; i++) {
      starPositions[i * 3] = (Math.random() - 0.5) * 400;
      starPositions[i * 3 + 1] = (Math.random() - 0.5) * 400;
      starPositions[i * 3 + 2] = (Math.random() - 0.5) * 400;
      starScales[i] = Math.random();
    }

    starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    starGeo.setAttribute('aScale', new THREE.BufferAttribute(starScales, 1));

    const starMat = new THREE.ShaderMaterial({
      uniforms: {
        time: { value: 0 }
      },
      vertexShader: `
        attribute float aScale;
        uniform float time;
        varying float vBrightness;
        void main() {
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * mvPosition;
          float blink = sin(time * 3.0 + aScale * 62.8) * 0.5 + 0.5;
          vBrightness = blink;
          gl_PointSize = (1.5 + blink * 2.0) * (200.0 / -mvPosition.z);
        }
      `,
      fragmentShader: `
        varying float vBrightness;
        void main() {
          float dist = length(gl_PointCoord - vec2(0.5));
          if (dist > 0.5) discard;
          float alpha = smoothstep(0.5, 0.0, dist);
          gl_FragColor = vec4(1.0, 0.95, 1.0, alpha * (0.4 + vBrightness * 0.6));
        }
      `,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const starField = new THREE.Points(starGeo, starMat);
    scene.add(starField);

    // 4. Nebulosa Realista (Polvo de gas magenta y violeta)
    const nebulaCount = 600;
    const nebulaGeo = new THREE.BufferGeometry();
    const nebulaPos = new Float32Array(nebulaCount * 3);
    const nebulaColors = new Float32Array(nebulaCount * 3);

    const palette = [
      new THREE.Color(0xff007f), // Magenta
      new THREE.Color(0x8a2be2), // Púrpura
      new THREE.Color(0x4169e1), // Azul real
      new THREE.Color(0xff1493)  // Rosa profundo
    ];

    for (let i = 0; i < nebulaCount; i++) {
      const radius = 10 + Math.random() * 50;
      const theta = Math.random() * Math.PI * 2;
      const phi = (Math.random() - 0.5) * 0.8;

      nebulaPos[i * 3] = radius * Math.cos(theta);
      nebulaPos[i * 3 + 1] = (Math.random() - 0.5) * 8;
      nebulaPos[i * 3 + 2] = radius * Math.sin(theta);

      const color = palette[Math.floor(Math.random() * palette.length)];
      nebulaColors[i * 3] = color.r;
      nebulaColors[i * 3 + 1] = color.g;
      nebulaColors[i * 3 + 2] = color.b;
    }

    nebulaGeo.setAttribute('position', new THREE.BufferAttribute(nebulaPos, 3));
    nebulaGeo.setAttribute('color', new THREE.BufferAttribute(nebulaColors, 3));

    const nebulaMat = new THREE.PointsMaterial({
      size: 18,
      vertexColors: true,
      transparent: true,
      opacity: 0.12,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const nebula = new THREE.Points(nebulaGeo, nebulaMat);
    scene.add(nebula);

    // 5. Sol Realista con Shader Procedural
    const sunGeo = new THREE.SphereGeometry(4.2, 64, 64);
    const sunMat = new THREE.ShaderMaterial({
      uniforms: {
        time: { value: 0 }
      },
      vertexShader: `
        varying vec3 vNormal;
        varying vec2 vUv;
        void main() {
          vNormal = normalize(normalMatrix * normal);
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float time;
        varying vec3 vNormal;
        varying vec2 vUv;
        
        // Simulación de ruido para fuego solar
        float noise(vec2 p) {
          return sin(p.x * 10.0 + time * 2.0) * cos(p.y * 10.0 + time * 1.5);
        }

        void main() {
          float n = noise(vUv * 3.0);
          vec3 baseColor = vec3(1.0, 0.5, 0.0); // Naranja solar
          vec3 coreColor = vec3(1.0, 0.95, 0.5); // Centro amarillo incandescente
          vec3 spotColor = vec3(0.9, 0.2, 0.0); // Fuego intenso

          vec3 finalColor = mix(baseColor, coreColor, n + 0.3);
          finalColor = mix(finalColor, spotColor, sin(vUv.y * 20.0 + time) * 0.3);

          gl_FragColor = vec4(finalColor, 1.0);
        }
      `
    });
    const sun = new THREE.Mesh(sunGeo, sunMat);
    scene.add(sun);

    // Resplandor Corona Solar (Atmósfera exterior)
    const coronaGeo = new THREE.SphereGeometry(5.4, 32, 32);
    const coronaMat = new THREE.MeshBasicMaterial({
      color: 0xffaa33,
      transparent: true,
      opacity: 0.28,
      side: THREE.BackSide,
      blending: THREE.AdditiveBlending
    });
    scene.add(new THREE.Mesh(coronaGeo, coronaMat));

    // 6. Corazones Estilo Emoji 💖 (Geometría suave y acabados brillantes)
    function createEmojiHeartGeometry() {
      const shape = new THREE.Shape();
      // Dibujo optimizado para emular la forma redondeada del emoji
      shape.moveTo(0, 0.8);
      shape.bezierCurveTo(0.8, 1.5, 1.9, 1.0, 1.9, 0.1);
      shape.bezierCurveTo(1.9, -0.7, 1.1, -1.3, 0, -2.1);
      shape.bezierCurveTo(-1.1, -1.3, -1.9, -0.7, -1.9, 0.1);
      shape.bezierCurveTo(-1.9, 1.0, -0.8, 1.5, 0, 0.8);

      const extrudeSettings = {
        depth: 0.5,
        bevelEnabled: true,
        bevelSegments: 8,
        steps: 3,
        bevelSize: 0.35,
        bevelThickness: 0.35
      };
      
      const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      geo.center();
      return geo;
    }

    const heartGeo = createEmojiHeartGeometry();
    
    // Material rosa chicle brillante estilo iOS Emoji
    const heartMat = new THREE.MeshStandardMaterial({
      color: 0xff2a75,
      emissive: 0x880033,
      roughness: 0.15,
      metalness: 0.1,
      clearcoat: 1.0,
      clearcoatRoughness: 0.1
    });

    // 7. Órbitas Elegantes Fina
    const orbitRadii = [9, 13.5, 18, 22.5, 27, 31.5];
    orbitRadii.forEach(r => {
      const ringGeo = new THREE.BufferGeometry();
      const points = [];
      const segments = 128;
      for (let i = 0; i <= segments; i++) {
        const theta = (i / segments) * Math.PI * 2;
        points.push(new THREE.Vector3(Math.cos(theta) * r, 0, Math.sin(theta) * r));
      }
      ringGeo.setFromPoints(points);

      const ringMat = new THREE.LineBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.12
      });
      const ring = new THREE.Line(ringGeo, ringMat);
      scene.add(ring);
    });

    // 8. Frases Cariñosas
    const frases = [
      "Te quiero mucho 💖", "Eres mi universo ✨", "Sonríe siempre 😊", 
      "Un abrazo enorme 🫂", "Un poco de magia ✨", "Sueños al infinito 🚀", 
      "Magia sin fin 🔮", "Mi persona favorita 🤍", "Brilla siempre 🌟", 
      "Infinito amor ♾️", "Gracias por existir 🌸", "Pide un deseo 🌠",
      "Siempre juntos 💫", "Tu sonrisa ilumina ☀️"
    ];

    const heartsData = [];
    const labelsContainer = document.getElementById('labels-container');

    const totalHearts = 38;
    for (let i = 0; i < totalHearts; i++) {
      const heartMesh = new THREE.Mesh(heartGeo, heartMat);
      
      const scale = 0.35 + Math.random() * 0.25;
      heartMesh.scale.set(scale, scale, scale);

      const radius = orbitRadii[i % orbitRadii.length] + (Math.random() - 0.5) * 1.2;
      const angle = Math.random() * Math.PI * 2;
      const speed = (0.002 + Math.random() * 0.003) * (i % 2 === 0 ? 1 : -1);

      heartMesh.position.x = Math.cos(angle) * radius;
      heartMesh.position.z = Math.sin(angle) * radius;
      heartMesh.position.y = (Math.random() - 0.5) * 2;

      scene.add(heartMesh);

      let labelEl = null;
      if (i < frases.length) {
        labelEl = document.createElement('div');
        labelEl.className = 'frase-tag';
        labelEl.innerText = frases[i];
        labelsContainer.appendChild(labelEl);
      }

      heartsData.push({
        mesh: heartMesh,
        radius: radius,
        angle: angle,
        speed: speed,
        labelEl: labelEl
      });
    }

    // Proyección de Etiquetas a pantalla
    function updateLabels() {
      const tempV = new THREE.Vector3();
      heartsData.forEach(item => {
        if (item.labelEl) {
          item.mesh.getWorldPosition(tempV);
          tempV.y += 0.8; // Posición ligeramente sobre el corazón
          tempV.project(camera);

          if (tempV.z < 1) {
            const x = (tempV.x * 0.5 + 0.5) * window.innerWidth;
            const y = (tempV.y * -0.5 + 0.5) * window.innerHeight;
            item.labelEl.style.transform = `translate(-50%, -100%) translate(${x}px,${y}px)`;
            item.labelEl.style.opacity = '1';
          } else {
            item.labelEl.style.opacity = '0';
          }
        }
      });
    }

    // 9. Bucle de Animación
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();

      // Actualizar shaders
      starMat.uniforms.time.value = elapsedTime;
      sunMat.uniforms.time.value = elapsedTime;

      // Rotación suave de la nebulosa
      nebula.rotation.y = elapsedTime * 0.02;

      // Movimiento de corazones
      heartsData.forEach(item => {
        item.angle += item.speed;
        item.mesh.position.x = Math.cos(item.angle) * item.radius;
        item.mesh.position.z = Math.sin(item.angle) * item.radius;
        
        // Ligero bamboleo 3D
        item.mesh.rotation.y += 0.015;
        item.mesh.rotation.x = Math.sin(elapsedTime * 2 + item.radius) * 0.2;
      });

      controls.update();
      renderer.render(scene, camera);
      updateLabels();
    }

    animate();

    // Redimensionamiento
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
