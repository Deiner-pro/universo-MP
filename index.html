<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tu Universo 3D</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    /* Tarjeta con mensaje personalizable */
    #mensaje {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #ffffff;
      text-align: center;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.4);
      padding: 15px 25px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(5px);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }
    h1 {
      margin: 0 0 5px 0;
      font-size: 1.8rem;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }
    p {
      margin: 0;
      font-size: 1rem;
      color: #ddd;
    }
  </style>
</head>
<body>

  <div id="mensaje">
    <h1>EL UNIVERSO DE [NOMBRE]</h1>
    <p>Haz clic y arrastra para explorar. ¡Feliz Cumpleaños!</p>
  </div>

  <div id="canvas-container"></div>

  <!-- Carga de Three.js y OrbitControls desde CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // 1. Configuración Básica de la Escena
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 20, 35);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // Controles para rotar la vista con el mouse
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 2. Iluminación
    const ambientLight = new THREE.AmbientLight(0x333333);
    scene.add(ambientLight);

    const sunLight = new THREE.PointLight(0xffffff, 2, 300);
    scene.add(sunLight);

    // 3. Fondo de Estrellas
    const starsGeometry = new THREE.BufferGeometry();
    const starsCount = 3000;
    const starPositions = new Float32Array(starsCount * 3);

    for (let i = 0; i < starsCount * 3; i++) {
      starPositions[i] = (Math.random() - 0.5) * 400;
    }

    starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.8 });
    const starField = new THREE.Points(starsGeometry, starsMaterial);
    scene.add(starField);

    // 4. Creación del Sol
    const sunGeo = new THREE.SphereGeometry(4, 32, 32);
    const sunMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
    const sun = new THREE.Mesh(sunGeo, sunMat);
    scene.add(sun);

    // Glow suave alrededor del sol
    const glowGeo = new THREE.SphereGeometry(4.4, 32, 32);
    const glowMat = new THREE.MeshBasicMaterial({
      color: 0xffdd55,
      transparent: true,
      opacity: 0.3
    });
    const sunGlow = new THREE.Mesh(glowGeo, glowMat);
    scene.add(sunGlow);

    // 5. Generador de Planetas
    const planets = [];

    function createPlanet(radius, color, distance, speed, hasRing = false) {
      const orbitGroup = new THREE.Group();
      scene.add(orbitGroup);

      // Malla del planeta
      const geo = new THREE.SphereGeometry(radius, 32, 32);
      const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.8 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.x = distance;
      orbitGroup.add(mesh);

      // Línea de órbita visual
      const orbitGeo = new THREE.RingGeometry(distance - 0.05, distance + 0.05, 64);
      const orbitMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.1 });
      const orbitLine = new THREE.Mesh(orbitGeo, orbitMat);
      orbitLine.rotation.x = Math.PI / 2;
      scene.add(orbitLine);

      // Anillo (para planetas tipo Saturno)
      if (hasRing) {
        const ringGeo = new THREE.RingGeometry(radius + 0.5, radius + 1.8, 32);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xaaffff, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        mesh.add(ring);
      }

      planets.push({ group: orbitGroup, mesh: mesh, speed: speed });
    }

    // Creación de varios planetas
    createPlanet(0.8, 0x888888, 8, 0.03);   // Planeta 1
    createPlanet(1.2, 0x2288ff, 13, 0.02);  // Planeta 2 (Tipo Tierra)
    createPlanet(1.8, 0xff5533, 19, 0.012); // Planeta 3
    createPlanet(1.5, 0x00e5ff, 26, 0.008, true); // Planeta 4 con Anillo

    // 6. Bucle de Animación
    function animate() {
      requestAnimationFrame(animate);

      // Rotación del sol
      sun.rotation.y += 0.002;

      // Movimiento orbital de planetas
      planets.forEach(p => {
        p.group.rotation.y += p.speed;
        p.mesh.rotation.y += 0.01; // Rotación sobre su propio eje
      });

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // Redimensionamiento responsive
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
