<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universo para María</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020208;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Título principal neón */
    .title-banner {
      position: absolute;
      top: 8%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      width: 100%;
      pointer-events: none;
    }

    .title-banner h1 {
      color: #ffffff;
      font-size: 3.8rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: capitalize;
      text-shadow: 
        0 0 10px #fff,
        0 0 20px #ffb700,
        0 0 30px #ff8c00,
        0 0 50px #ff4500,
        0 0 80px #ff3300;
      animation: glow 2s infinite alternate ease-in-out;
    }

    @keyframes glow {
      0% {
        text-shadow: 
          0 0 10px #fff,
          0 0 20px #ffd700,
          0 0 30px #ff8c00,
          0 0 40px #ff4500;
      }
      100% {
        text-shadow: 
          0 0 15px #fff,
          0 0 25px #ffb700,
          0 0 45px #ff8c00,
          0 0 70px #ff4500,
          0 0 90px #ff2200;
      }
    }

    .instructions {
      position: absolute;
      bottom: 15px;
      width: 100%;
      text-align: center;
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.85rem;
      z-index: 10;
      pointer-events: none;
    }

    @media (max-width: 768px) {
      .title-banner h1 {
        font-size: 2.2rem;
      }
    }
  </style>
  <!-- Three.js y OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div class="title-banner">
    <h1>Universo para María 🌷</h1>
  </div>

  <div id="canvas-container"></div>
  <div class="instructions">Usa el ratón para mover la galaxia y hacer zoom</div>

  <script>
    // ------------------- ESCENA Y CÁMARA 3D -------------------
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020208, 0.0004);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, 160, 260);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // ------------------- ILUMINACIÓN INTENSA (SOL) -------------------
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const sunLight = new THREE.PointLight(0xffaa00, 3.5, 600);
    sunLight.position.set(0, 0, 0);
    scene.add(sunLight);

    const dirLight = new THREE.DirectionalLight(0xffd700, 1.2);
    dirLight.position.set(100, 100, 50);
    scene.add(dirLight);

    // ------------------- GENERADOR DE TEXTURA SOLAR -------------------
    function generateSunTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, '#ffcc00');
      grad.addColorStop(0.25, '#ff8800');
      grad.addColorStop(0.5, '#ff3300');
      grad.addColorStop(0.75, '#ff9900');
      grad.addColorStop(1, '#ffee00');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Manchas solares y llamaradas simuladas
      ctx.fillStyle = 'rgba(255, 255, 200, 0.35)';
      for (let i = 0; i < 600; i++) {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height;
        const rx = Math.random() * 80 + 10;
        const ry = Math.random() * 20 + 5;
        ctx.beginPath();
        ctx.ellipse(x, y, rx, ry, Math.random() * Math.PI, 0, Math.PI * 2);
        ctx.fill();
      }

      return new THREE.CanvasTexture(canvas);
    }

    // ------------------- EL SOL HERMOSO CENTRAL -------------------
    const sunGroup = new THREE.Group();
    scene.add(sunGroup);

    const sunTexture = generateSunTexture();
    const sunGeo = new THREE.SphereGeometry(22, 64, 64);
    const sunMat = new THREE.MeshStandardMaterial({
      map: sunTexture,
      roughness: 0.1,
      metalness: 0.1,
      emissive: 0xff6600,
      emissiveIntensity: 0.85
    });
    const sunMesh = new THREE.Mesh(sunGeo, sunMat);
    sunMesh.renderOrder = 10;
    sunGroup.add(sunMesh);

    // Corona y Resplandor Exterior del Sol
    function createSunGlow() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
      grad.addColorStop(0, 'rgba(255, 230, 150, 1)');
      grad.addColorStop(0.25, 'rgba(255, 140, 0, 0.7)');
      grad.addColorStop(0.6, 'rgba(255, 60, 0, 0.25)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 256);

      const glowTex = new THREE.CanvasTexture(canvas);
      const glowMat = new THREE.SpriteMaterial({
        map: glowTex,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const glowSprite = new THREE.Sprite(glowMat);
      glowSprite.scale.set(110, 110, 1);
      return glowSprite;
    }

    const sunGlow = createSunGlow();
    sunGroup.add(sunGlow);

    // ------------------- GALAXIA Y NEBULOSA EN TODA LA PANTALLA -------------------
    const galaxyGroup = new THREE.Group();
    scene.add(galaxyGroup);

    function createNebulaTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
      grad.addColorStop(0, 'rgba(255, 105, 180, 0.4)');
      grad.addColorStop(0.35, 'rgba(138, 43, 226, 0.22)');
      grad.addColorStop(0.7, 'rgba(0, 191, 255, 0.1)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 256);

      return new THREE.CanvasTexture(canvas);
    }

    const nebulaTexture = createNebulaTexture();
    const numNebulaClouds = 250;

    for (let i = 0; i < numNebulaClouds; i++) {
      const nebulaMat = new THREE.SpriteMaterial({
        map: nebulaTexture,
        transparent: true,
        blending: THREE.AdditiveBlending,
        opacity: Math.random() * 0.28 + 0.1,
        depthWrite: false
      });
      const nebula = new THREE.Sprite(nebulaMat);

      const u = Math.random();
      const v = Math.random();
      const theta = u * 2.0 * Math.PI;
      const phi = Math.acos(2.0 * v - 1.0);
      const r = Math.pow(Math.random(), 0.6) * 320 + 45;

      nebula.position.set(
        r * Math.sin(phi) * Math.cos(theta),
        r * Math.sin(phi) * Math.sin(theta) * 0.5,
        r * Math.cos(phi)
      );

      const scale = Math.random() * 90 + 40;
      nebula.scale.set(scale, scale, 1);
      galaxyGroup.add(nebula);
    }

    // ------------------- ESTRELLAS BLANCAS CON PARPADEO -------------------
    const particleCount = 12000;
    const particleGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);

    const twinkleSpeeds = new Float32Array(particleCount);
    const twinkleOffsets = new Float32Array(particleCount);
    const baseSizes = new Float32Array(particleCount);

    for (let i = 0; i < particleCount; i++) {
      const r = Math.pow(Math.random(), 1.5) * 230 + 15;
      const theta = Math.random() * Math.PI * 2;
      const y = (Math.random() - 0.5) * (20 * (1 - r / 250));

      positions[i * 3] = Math.cos(theta) * r;
      positions[i * 3 + 1] = y;
      positions[i * 3 + 2] = Math.sin(theta) * r;

      colors[i * 3] = 1.0; 
      colors[i * 3 + 1] = 1.0; 
      colors[i * 3 + 2] = 1.0;

      twinkleSpeeds[i] = Math.random() * 4 + 1.5;
      twinkleOffsets[i] = Math.random() * Math.PI * 2;
      baseSizes[i] = Math.random() * 1.3 + 0.6;
    }

    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    particleGeo.setAttribute('twinkleSpeed', new THREE.BufferAttribute(twinkleSpeeds, 1));
    particleGeo.setAttribute('twinkleOffset', new THREE.BufferAttribute(twinkleOffsets, 1));
    particleGeo.setAttribute('baseSize', new THREE.BufferAttribute(baseSizes, 1));

    const twinkleVertexShader = `
      attribute float twinkleSpeed;
      attribute float twinkleOffset;
      attribute float baseSize;
      uniform float uTime;
      varying vec3 vColor;

      void main() {
        vColor = color;
        float twinkle = sin(uTime * twinkleSpeed + twinkleOffset);
        float sizeFactor = 0.2 + 0.8 * (twinkle * 0.5 + 0.5);

        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mvPosition;
        gl_PointSize = (baseSize * sizeFactor) * (300.0 / -mvPosition.z);
      }
    `;

    const twinkleFragmentShader = `
      varying vec3 vColor;

      void main() {
        float dist = length(gl_PointCoord - vec2(0.5));
        if (dist > 0.5) discard;
        float alpha = smoothstep(0.5, 0.05, dist);
        gl_FragColor = vec4(vColor, alpha * 0.95);
      }
    `;

    const particleMat = new THREE.ShaderMaterial({
      vertexShader: twinkleVertexShader,
      fragmentShader: twinkleFragmentShader,
      uniforms: { uTime: { value: 0.0 } },
      vertexColors: true,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    const galaxyParticles = new THREE.Points(particleGeo, particleMat);
    galaxyGroup.add(galaxyParticles);

    // ------------------- TULIPANES -------------------
    function createTulipTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      ctx.beginPath();
      ctx.moveTo(64, 75);
      ctx.quadraticCurveTo(68, 95, 64, 115);
      ctx.strokeStyle = '#43a047';
      ctx.lineWidth = 5;
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(54, 96, 7, 16, -0.4, 0, Math.PI * 2);
      ctx.fillStyle = '#66bb6a';
      ctx.fill();

      ctx.fillStyle = '#d81b60';
      ctx.beginPath();
      ctx.ellipse(50, 52, 14, 26, -0.25, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(78, 52, 14, 26, 0.25, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ff4081';
      ctx.beginPath();
      ctx.ellipse(64, 50, 16, 28, 0, 0, Math.PI * 2);
      ctx.shadowColor = '#ff80ab';
      ctx.shadowBlur = 8;
      ctx.fill();

      return new THREE.CanvasTexture(canvas);
    }

    const tulipTexture = createTulipTexture();
    const tulipGroup = new THREE.Group();
    galaxyGroup.add(tulipGroup);

    const numTulips = 140;
    for (let i = 0; i < numTulips; i++) {
      const spriteMat = new THREE.SpriteMaterial({ map: tulipTexture, transparent: true });
      const sprite = new THREE.Sprite(spriteMat);

      const r = Math.random() * 200 + 35;
      const angle = Math.random() * Math.PI * 2;
      const y = (Math.random() - 0.5) * 16;

      sprite.position.set(Math.cos(angle) * r, y, Math.sin(angle) * r);
      sprite.scale.set(5.0, 5.0, 1);
      tulipGroup.add(sprite);
    }

    // ------------------- CORAZÓN 💖 EMOJI -------------------
    function createHeartEmojiTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      ctx.font = '85px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(255, 105, 180, 0.8)';
      ctx.shadowBlur = 12;
      ctx.fillText('💖', canvas.width / 2, canvas.height / 2);

      return new THREE.CanvasTexture(canvas);
    }

    const heartTexture = createHeartEmojiTexture();
    const heartGroup = new THREE.Group();
    galaxyGroup.add(heartGroup);

    // ------------------- FRASES EN 6 ÓRBITAS -------------------
    const orbitPhrases = [
      // Órbita 1 (Interior)
      ["Eres Luz ✨", "Te quiero mucho 💖", "Sigue brillando 🌟", "¡Universo hermoso! 🎉", "Un abrazo enorme 🤗", "Mi favorita 💕"],
      // Órbita 2
      ["Deseos infinitos 🌠", "Siempre sonríe 😊", "Un año de magia ✨", "¡Universo María! 🌷", "Sé muy feliz 🌺", "Gracias por existir 💫"],
      // Órbita 3
      ["El universo celebra 🌌", "Más que mil estrellas 💫", "Sueños al infinito 🚀", "Universo y magia ☀️", "Infinitas alegrías 🌸", "Eres increíble 🌷"],
      // Órbita 4
      ["Un año radiante ✨", "Vive cada instante 💖", "Brillas con alma 🌟", "Sonrisas eternas 😊", "Día maravilloso 🎉", "Amor y luz 💕"],
      // Órbita 5
      ["Abrazos al cielo 🌌", "Magia sin fin 🌠", "Momento inolvidable ☀️", "Sigue tus sueños 🚀", "Tu luz es única 🌺", "Siempre especial 💫"],
      // Órbita 6 (Exterior)
      ["Pide un deseo ✨", "Un universo para ti ☀️", "Felicidad pura 😊", "Brillo infinito ☀️", "Te queremos María 💖", "Celebra en grande 🌸"]
    ];

    function createPhraseSprite(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      ctx.font = 'Bold 28px "Segoe UI", Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ffd700';
      ctx.shadowBlur = 10;
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);

      const texture = new THREE.CanvasTexture(canvas);
      const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(spriteMat);
      sprite.scale.set(38, 9.5, 1);
      return sprite;
    }

    // Dibujar las 6 órbitas e insertar las frases y corazones 💖
    for (let orbitIndex = 0; orbitIndex < 6; orbitIndex++) {
      const radius = (orbitIndex + 1) * 32 + 10;

      // Línea de la órbita
      const orbitGeo = new THREE.RingGeometry(radius - 0.3, radius + 0.3, 128);
      const orbitMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.15
      });
      const orbitMesh = new THREE.Mesh(orbitGeo, orbitMat);
      orbitMesh.rotation.x = Math.PI / 2;
      galaxyGroup.add(orbitMesh);

      // Distribuir 6 frases uniformemente
      const phrasesInOrbit = orbitPhrases[orbitIndex];
      const angleStep = (Math.PI * 2) / 6;
      const orbitOffsetAngle = orbitIndex * 0.3;

      phrasesInOrbit.forEach((phraseText, i) => {
        const sprite = createPhraseSprite(phraseText);
        const angle = i * angleStep + orbitOffsetAngle;

        sprite.position.set(
          Math.cos(angle) * radius,
          (Math.random() - 0.5) * 6 + 2,
          Math.sin(angle) * radius
        );

        galaxyGroup.add(sprite);
      });

      // Distribuir corazones 💖 orbitando en cada anillo
      const heartsPerOrbit = 20;
      for (let h = 0; h < heartsPerOrbit; h++) {
        const heartSpriteMat = new THREE.SpriteMaterial({ 
          map: heartTexture, 
          transparent: true,
          depthWrite: false 
        });
        const heartSprite = new THREE.Sprite(heartSpriteMat);

        const hAngle = Math.random() * Math.PI * 2;
        const hRadius = radius + (Math.random() - 0.5) * 8;
        const hY = (Math.random() - 0.5) * 12;

        heartSprite.position.set(
          Math.cos(hAngle) * hRadius,
          hY,
          Math.sin(hAngle) * hRadius
        );

        const scale = Math.random() * 3.5 + 4.5;
        heartSprite.scale.set(scale, scale, 1);
        heartGroup.add(heartSprite);
      }
    }

    // ------------------- BUCLE DE ANIMACIÓN -------------------
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();

      // Parpadeo de estrellas
      particleMat.uniforms.uTime.value = elapsedTime;

      // Rotación y latido del Sol
      sunMesh.rotation.y = elapsedTime * 0.08;
      const scalePulse = 1 + Math.sin(elapsedTime * 2) * 0.02;
      sunGlow.scale.set(110 * scalePulse, 110 * scalePulse, 1);

      // Rotación suave de la galaxia completa
      galaxyGroup.rotation.y = elapsedTime * 0.05;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
